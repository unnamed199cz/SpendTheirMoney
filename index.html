<!DOCTYPE html>
<html>
  <head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width">
  <title>Spend their Networth</title>
  <link href="style.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftlnee1c9QX4TctnWMn13TZye+giMm8u2LwA=="
    crossorigin="anonymous" referrerpolicy="no-referrer" />
  <script src="script.js" defer></script>

</head>
<body>
  <div class="toprightbuttons">
  <button onclick="APIWindow()" id="API"></button><input id=APIInput oninput="APICall()"></input><button id="theme-toggle">🌙</button>
  </div>
  <header>
    <h1>Spend money of someone else</h1>
  </header>

<div id="introduction">
    <h1>SPEND ALL OF "API" MONEY</h1>
  </div>
<p id="wholebalance" style="position: sticky; top: 0px; padding: 20px; text-align: center; font-size: 50px">Balance remaining: <span id="balance">1000000000</span></p>
  <!-- start of section 1 -->
  <div class="startsection" id="Xanax">
    <div class="item">
      <img src=" https://www.torn.com/images/items/206/large.png">
      <br><span>Xanax</span>
      <br><span id="itemprice_Xanax">900000</span>
      <div class="counter">
        <button onclick="sellItem(this)">-</button>
        <input type=number id="Xanax">
        <button onclick="buyItem(this)">+</button>
      </div> 
    </div> 
    <div class="item">
      <img src="https://www.torn.com/images/items/261/large.png">
      <br><span>Wolverine plushie</span>
      <br><span id="itemprice_Wolverine" >89990</span>
      <div class="counter">
        <button onclick="sellItem(this)">-</button>
        <input type=number id="Wolverine">
        <button onclick="buyItem(this)">+</button>
      </div>
    </div>
    <div class="item">
      <img src="https://www.torn.com/images/items/370/large.png">
      <br><span>Drug pack</span>
      <br><span id="itemprice_DrugPack" >4600000</span>
      <div class="counter">
        <button onclick="sellItem(this)">-</button>
        <input type=number id="DrugPack">
        <button onclick="buyItem(this)">+</button>
      </div>
    </div>
  </div> <!-- end of first section -->


<div style="padding-bottom:2000px"></div>
